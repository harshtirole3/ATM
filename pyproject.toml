[project]
name = "atm-simulator"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "Flask>=3.0,<4",
    "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
desktop = [
    "matplotlib>=3.8,<4",
    "pandas>=2.1,<4",
    "scikit-learn>=1.3,<2",
]

[tool.vercel]
entrypoint = "web_app:app"
